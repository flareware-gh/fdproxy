name: Collect 0DTE Data

on:
  schedule:
    # Run every 10 minutes during market hours (UTC)
    # Covers 09:30-16:00 ET = 14:30-21:00 UTC (EST) or 13:30-20:00 UTC (EDT)
    # Using */10 during the broader window to handle DST transitions
    - cron: '*/10 13-21 * * 1-5'
  
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to collect (or auto)'
        required: false
        default: 'auto'
      symbols:
        description: 'Symbols to collect (comma-separated, or empty for all)'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Run collection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            SLOT_ARG="--slot ${{ github.event.inputs.slot }}"
          else
            SLOT_ARG="--slot auto"
          fi
          
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            SYMBOLS_ARG="--symbols ${{ github.event.inputs.symbols }}"
          else
            SYMBOLS_ARG=""
          fi
          
          fdproxy collect $SLOT_ARG $SYMBOLS_ARG --json | tee collect_output.json
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collect-logs
          path: collect_output.json
