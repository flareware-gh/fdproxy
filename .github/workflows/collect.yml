name: Collect 0DTE Data

on:
  schedule:
    # Per-slot cron schedules using EDT (UTC-4)
    # Note: These times are for Eastern Daylight Time. When switching to EST (UTC-5),
    # these will need updating to add 1 hour to each UTC time.
    - cron: '35 13 * * 1-5'  # m0935 at 13:35 UTC
    - cron: '30 14 * * 1-5'  # m1030 at 14:30 UTC
    - cron: '0 16 * * 1-5'   # m1200 at 16:00 UTC
    - cron: '0 18 * * 1-5'   # m1400 at 18:00 UTC
    - cron: '45 18 * * 1-5'  # m1445 at 18:45 UTC
    - cron: '0 19 * * 1-5'   # t1500 at 19:00 UTC
    - cron: '15 19 * * 1-5'  # t1515 at 19:15 UTC
    - cron: '30 19 * * 1-5'  # t1530 at 19:30 UTC
    - cron: '45 19 * * 1-5'  # t1545 at 19:45 UTC
    - cron: '50 19 * * 1-5'  # t1550 at 19:50 UTC
    - cron: '55 19 * * 1-5'  # t1555 at 19:55 UTC
    - cron: '0 20 * * 1-5'   # close at 20:00 UTC
  
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to collect (or auto)'
        required: false
        default: 'auto'
      symbols:
        description: 'Symbols to collect (comma-separated, or empty for all)'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Run collection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          if [ -z "$SLOT" ]; then
            SLOT="auto"
          fi
          
          SYMBOLS="${{ github.event.inputs.symbols }}"
          if [ -n "$SYMBOLS" ]; then
            SYMBOLS_ARG="--symbols $SYMBOLS"
          else
            SYMBOLS_ARG=""
          fi
          
          # Pass trigger metadata; GITHUB_RUN_ID is picked up from env
          fdproxy collect \
            --slot "$SLOT" \
            $SYMBOLS_ARG \
            --trigger-source github_actions \
            --json | tee collect_output.json
          
          # Ensure the job fails if collect reported an error
          exit ${PIPESTATUS[0]}
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collect-logs
          path: collect_output.json
