name: Collect 0DTE Data

on:
  schedule:
    # Collection schedule using EDT (UTC-4)
    # Note: These times are for Eastern Daylight Time. When switching to EST (UTC-5),
    # these will need updating to add 1 hour to each UTC time.
    # Request labels are derived from request_started_at timestamp (5-min buckets in ET)
    - cron: '35 13 * * 1-5'  # 09:35 ET
    - cron: '30 14 * * 1-5'  # 10:30 ET
    - cron: '0 16 * * 1-5'   # 12:00 ET
    - cron: '0 18 * * 1-5'   # 14:00 ET
    - cron: '45 18 * * 1-5'  # 14:45 ET
    - cron: '0 19 * * 1-5'   # 15:00 ET
    - cron: '15 19 * * 1-5'  # 15:15 ET
    - cron: '30 19 * * 1-5'  # 15:30 ET
    - cron: '45 19 * * 1-5'  # 15:45 ET
    - cron: '50 19 * * 1-5'  # 15:50 ET
    - cron: '55 19 * * 1-5'  # 15:55 ET
    - cron: '0 20 * * 1-5'   # 16:00 ET (close)
  
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Symbols to collect (comma-separated, or empty for all)'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Run collection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          SYMBOLS="${{ github.event.inputs.symbols }}"
          if [ -n "$SYMBOLS" ]; then
            SYMBOLS_ARG="--symbols $SYMBOLS"
          else
            SYMBOLS_ARG=""
          fi
          
          # Pass trigger metadata; GITHUB_RUN_ID is picked up from env
          # request_label is derived from request_started_at timestamp
          fdproxy collect \
            $SYMBOLS_ARG \
            --trigger-source github_actions \
            --json | tee collect_output.json
          
          # Ensure the job fails if collect reported an error
          exit ${PIPESTATUS[0]}
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collect-logs
          path: collect_output.json
