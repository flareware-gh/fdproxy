[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fdproxy"
version = "0.1.0"
description = "Research infrastructure for late-day 0DTE ETF options"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9.0",
    "httpx>=0.25.0",
    "supabase>=2.0.0",
    "yfinance>=0.2.30",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pytz>=2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
fdproxy = "fdproxy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fdproxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
